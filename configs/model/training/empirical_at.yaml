# configs/model/training/empirical_at.yaml
# @package model.training
defaults:
  # Pulls configs/surrogate_model/jmila_surrogate.yaml into empirical_at.surrogate
  - /surrogate_model@empirical_at.surrogate: jmila_surrogate
  # Pulls configs/attack/trades.yaml into empirical_at.attack
  - /attack@empirical_at.attack: trades
  - _self_

strategy: sklearn
defense_mode: empirical_at
batch_size: 128

empirical_at:
  benign_label: 0
  augmentation:
    ratio: 0.5
    filter_realizable: true
    batch_size: 128

  surrogate:
    training:
      epochs: 20
      batch_size: 256
      lr: 0.001
      weight_decay: 0.0001
      defense_mode: none

  attack:
    epsilon: 0.04
    alpha: 0.01
    steps: 10
    discrete_projection: true
    immutable_features: [DIR, FLG]