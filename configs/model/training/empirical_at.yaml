# configs/model/training/empirical_at.yaml
# @package model.training
strategy: sklearn
defense_mode: empirical_at
batch_size: 128

empirical_at:
  benign_label: 0
  # Default AT generation mode: 'trades' or 'pgd'
  at_mode: trades
  surrogate:
    name: jmila_surrogate
    requires_flatten: true
    params:
      hidden_dims: [1024, 512, 256, 128, 64, 32]
      dropout: 0.3
    training:
      epochs: 2 #50
      batch_size: 128
      lr: 0.001
      weight_decay: 0.00001
      defense_mode: none
  attack:
    name: ${..at_mode}  # Resolves dynamically to 'trades' or 'pgd'
    params:
      epsilon: 0.04
      alpha: 0.01
      steps: 10
      trades_beta: 6.0
      discrete_projection: true # allows to project adversarial samples back to the discrete feature space before feeding them to the target model
      immutable_features: [DIR, FLG]
  augmentation:
    ratio: 0.5 # Ratio of malicious training flows selected for adversarial generation.
    # filter_realizable: true
    batch_size: 128