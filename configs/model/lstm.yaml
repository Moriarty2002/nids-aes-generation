name: lstm
requires_flatten: false
checkpoint: "runs/checkpoints/bilstm_seed{seed}/nids.pt"
params: {hidden_size: 128, layers: 2, dropout: 0.2}
training:
  epochs: 20
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  adversarial_training: false
  defense_mode: none
  pgd_epsilon: 0.02
  pgd_alpha: 0.005
  pgd_steps: 5
  trades_beta: 6.0
