name: transformer
requires_flatten: false
checkpoint: "runs/checkpoints/transformer_seed{seed}/nids.pt"
params: {d_model: 128, heads: 4, layers: 2, dropout: 0.1}
training:
  epochs: 20
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  adversarial_training: false
  defense_mode: none
  pgd_epsilon: 0.02
  pgd_alpha: 0.005
  pgd_steps: 5
  trades_beta: 6.0
