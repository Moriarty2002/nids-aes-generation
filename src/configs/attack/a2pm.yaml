# Author ordered patterns; frozen TRAIN fitting and physical packet adaptation.
# Probabilities/ratios are author documentation examples, not CICIoMT optima.
name: a2pm
variant: "a2pm_v5_int${.params.patterns.0.probability}_comb${.params.patterns.1.probability}_r${.params.patterns.0.ratio}_max${.params.patterns.0.max_ratio}_pat${.params.patience}_iter${.params.max_iterations}"
params:
  patterns:
    - type: interval
      features: [1]
      probability: 0.6
      ratio: 0.1
      max_ratio: 0.3
    - type: combination
      features: [0, 2, 3, 4, 5]
      locked_features: [2, 4]
      probability: 0.4
  class_patterns: {}
  max_iterations: 20
  patience: 0
  target_label: 0
# 0 disables early stopping; smoke's two iterations remains author-valid.
discrete_projection: false
immutable_features: [DIR, FLG]
checkpoint: "${experiment_dir}/checkpoints/generators/${attack.name}/${attack.variant}/seed{seed}.pt"
