# Active CICIoMT2024 order: 0=PL, 1=IAT, 2=DIR, 3=WIN, 4=FLG, 5=TTL.
# PL/WIN/TTL are integral physical states sampled from observed training
# combinations (categorical pattern adaptation, not wire categorical types).
# DIR/FLG are immutable; IAT is continuous float64 physical time. Indices
# are packet-local and MUST be reviewed when dataset.feature_names changes.
# .6/.4 pattern probabilities follow an author-repository *example*, not an
# original-paper optimal setting for CICIoMT2024.
name: a2pm
variant: "a2pm_v4_int${.params.interval_probability}_comb${.params.combination_probability}_r${.params.interval_ratio}_max${.params.max_ratio}_pat${.params.patience}_iter${.params.max_iterations}"

params:
  continuous_idx: [1]
  categorical_idx: [0, 3, 5]
  locked_features: [2, 4]
  interval_probability: 0.6
  combination_probability: 0.4
  max_iterations: 20
  # Source: A2PM official IntervalPattern configuration example; not CICIoMT-optimal.
  interval_ratio: 0.1
  max_ratio: 0.3
  # Source: A2PMethod fit_generate documentation example; no test-time partial_fit.
  patience: 2
  target_label: 0

discrete_projection: false
checkpoint: "${experiment_dir}/checkpoints/generators/${attack.name}/${attack.variant}/seed{seed}.pt"
