# Hydra configs/attack/amd_gan.yaml
# action=train_attack -> AMDGANFeatureAttack.train(config=..., seed=..., gpu=...)
# action=evaluate_attack -> registry constructs AMDGANFeatureAttack from settings.
name: amd_gan
variant: "classwise_wgangp_table2_v7_densified_xai"

# Active packet order: PL,IAT,DIR,WIN,FLG,TTL. IAT has a continuous
# log-scaled head. Integer-valued PL/WIN/TTL use observed-state categorical
# codebooks; DIR/FLG categorical heads encode immutable conditioning, NOT
# permission to edit their physical values. This is a NIDS GAN adaptation,
# not evidence of the originating paper's optimal steps or feature mapping.
continuous_idx: [1]
categorical_idx: [0,2,3,4,5]
max_categories: 3000
latent_dim: 100
gumbel_tau: 0.7

training_steps_large: 15000
training_steps_small: 25000
training_steps_nano: 30000
critic_steps_large: 5
critic_steps_small: 3
critic_steps_nano: 2
learning_rate_large: 0.0001
learning_rate_small: 0.00005
learning_rate_nano: 0.00002
# Membership is ALL authorized manifest train IDs, never a private random
# fraction. Any sampling must be explicitly implemented and provenance-bound.

xai_threshold: 0.85
xai_samples: 256
xai_trees: 100

# IMPORTANT:
# The same expression is resolved under train_attack and evaluate_attack.
# Canonical generator path must match across train_attack and evaluate_attack.
checkpoint: "${experiment_dir}/checkpoints/generators/${attack.name}/${attack.variant}/seed{seed}.pt"
# Must not overwrite GAN coordinates before independent gatekeeper verification.
# The inherited FeatureSpaceAttack finalizer still protects victim packets,
# padding, and exact authoritative float64 <-> float32 consistency.
discrete_projection: true
clip_ranges: ${dataset.clip_ranges}
immutable_features: ${dataset.immutable_features}
