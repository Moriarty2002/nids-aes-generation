name: tdtce
epsilon: 0.04
timesteps: 50
hidden_dim: 64
num_blocks: 4
patch_size: 1
adaln_mode: adaln_g
learning_rate: 1e-3
epochs: 30
batch_size: 256
latent_dim: 32
num_heads: 4
attention_window: 16
dropout: 0.0
weight_rec: 1.0
weight_kl: 0.01
weight_adv: 1.0
weight_pre: 1.0
weight_mahal: 0.1
targeted: true
target_label: 0
discrete_projection: true
clip_ranges: ${dataset.clip_ranges} # set to null to disable clipping
immutable_features: ${dataset.immutable_features}
mahalanobis_full_cov_max_dim: 512
mahalanobis_ridge: 1e-3
gradient_clip_norm: 1.0
# The evaluation workflow formats {seed} when it constructs the attack.
checkpoint: "${output_dir}/checkpoints/tdtce_seed{seed}.pt"
variant: "steps${.timesteps}_dim${.hidden_dim}"
