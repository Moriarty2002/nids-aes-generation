name: tdtce
# Table 1 AdaLN-G I (N=6, image p=4). Here a patch is four ORDERED
# packet tokens, not a 2-D image square. The train-only surrogate, masks,
# physical finalizer and strict independent gate are mandatory adaptations.
# Other widths, schedules and loss coefficients below are unverified NIDS-native.
source_recipe_status: paper_table1_GI_packet_adaptation
epsilon: 0.04
timesteps: 50
hidden_dim: 64
num_blocks: 6
patch_size: 4
adaln_mode: adaln_g
learning_rate: 1e-3
epochs: 30
batch_size: 256
latent_dim: 32
num_heads: 4
attention_window: 16
dropout: 0.0
weight_rec: 1.0
weight_kl: 0.01
weight_adv: 1.0
weight_pre: 1.0
weight_mahal: 0.1
targeted: true
target_label: 0
discrete_projection: true
clip_ranges: ${dataset.clip_ranges} # set to null to disable clipping
immutable_features: ${dataset.immutable_features}
mahalanobis_full_cov_max_dim: 512
mahalanobis_ridge: 1e-3
gradient_clip_norm: 1.0
# The evaluation workflow formats {seed} when it constructs the attack.
checkpoint: "${experiment_dir}/checkpoints/generators/${attack.name}/${attack.variant}/seed{seed}.pt"
variant: "pktGI_v3_gru_records_n${.num_blocks}_p${.patch_size}_t${.timesteps}_z${.latent_dim}_r${.weight_rec}_k${.weight_kl}_a${.weight_adv}_q${.weight_pre}_m${.weight_mahal}"
