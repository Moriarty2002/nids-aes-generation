# configs/attack/deepred.yaml
# Registered by attacks.problem_space.deepred (import the module on startup).
# Offline, benign/malicious *training-only* NFStream-style raw features.
# Training NPZ requires float64 features[:, 0] = src2dst_bytes,
# features[:, 1] = src2dst_max_ps, int labels (0=benign),
# feature_names = ["src2dst_bytes", "src2dst_max_ps"].
# Optional oracle_labels may be provided for substitute-model fitting.
name: deepred
variant: offline_udp_sfp

# This adaptation supports one or two src2dst primary measurements.
# Use [src2dst_max_ps] for one-packet SPSF; pair selection often fails closed
# because exact packet/byte geometry cannot satisfy both targets.
attack_features: [src2dst_bytes]
training_npz: "data/deepred_training_flows.npz"

# Source endpoint of the flow's first packet. Must be set explicitly.
attacker_ip: null

# Training: no queries to the evaluation target model.
latent_dim: 200
batch_size: 64
surrogate_epochs: 30
gan_epochs: 100
learning_rate: 0.0002
surrogate_learning_rate: 0.001
lambda_surrogate: 1.0
lambda_minimal: 0.05

device: auto
max_delta_bytes: 512
max_delta_max_ps: 256
mtu: 1500
max_added_packets: 4

# For evaluate_attack, override checkpoint to the train_attack seed's path;
# output_dir must be persistent for the extractor to open generated PCAPs.
checkpoint: "${output_dir}/checkpoints/deepred_seed{seed}.pt"
output_dir: "${output_dir}/deepred_pcaps"
