# configs/attack/deepred.yaml
# Registered by attacks.problem_space.deepred (import the module on startup).
# Training uses registered raw-PCAP train IDs, derives actual physical
# src2dst_bytes/src2dst_max_ps from those captures, and obtains classifier
# feedback ONLY from independently registered pretrained surrogate weights.
# The old external NPZ/oracle-label path is forbidden on clean-restart runs.
name: deepred
variant: offline_udp_sfp

# This adaptation supports one or two src2dst primary measurements.
# Use [src2dst_max_ps] for one-packet SPSF; pair selection often fails closed
# because exact packet/byte geometry cannot satisfy both targets.
attack_features: [src2dst_bytes]

# Source endpoint of the flow's first packet. Must be set explicitly.
attacker_ip: null

# Training: no queries to the evaluation target model.
latent_dim: 200
batch_size: 64
surrogate_epochs: 30
gan_epochs: 100
learning_rate: 0.0002
surrogate_learning_rate: 0.001
lambda_surrogate: 1.0
lambda_minimal: 0.05

device: auto
max_delta_bytes: 512
max_delta_max_ps: 256
mtu: 1500
max_added_packets: 4

# Canonical seed-specific artifact; raw-PCAP preprocessing remains uncertified.
# PCAP output_dir remains a separate execution-local working area.
checkpoint: "${experiment_dir}/checkpoints/generators/${attack.name}/${attack.variant}/seed{seed}.pt"
output_dir: "${output_dir}/deepred_pcaps"
